<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Petualangan Tata Surya — Rotasi dan Revolusi Bumi</title>
<style>
/* ============ ROOT VARIABEL ============ */
:root{
  --midnight-navy:#0a0e27;
  --deep-blue:#131a3a;
  --soft-lavender:#a29bfe;
  --warm-gold:#f6c453;
  --pure-white:#ffffff;
  --soft-blue:#e8ecff;
  --card-bg:rgba(19,26,58,0.85);
  --border:rgba(162,155,254,0.25);
  --shadow:0 8px 30px rgba(0,0,0,0.45);
  --radius:16px;
  --transition:0.3s cubic-bezier(.4,0,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--midnight-navy);
  color:var(--pure-white);
  line-height:1.65;
  overflow-x:hidden;
  min-height:100vh;
}
/* ============ STARFIELD BACKGROUND ============ */
#starfield{
  position:fixed;top:0;left:0;width:100%;height:100%;
  z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse at 20% 10%,#1b2154 0%,#0a0e27 55%,#05061a 100%);
}
.star{
  position:absolute;background:#fff;border-radius:50%;
  animation:twinkle 3s infinite ease-in-out;
}
@keyframes twinkle{
  0%,100%{opacity:.2;transform:scale(.8);}
  50%{opacity:1;transform:scale(1.2);}
}
/* ============ NAVBAR ============ */
.navbar{
  position:sticky;top:0;z-index:1000;
  background:rgba(10,14,39,0.92);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
  padding:0.7rem 1.5rem;
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:1rem;
}
.brand{display:flex;align-items:center;gap:.6rem;cursor:pointer;}
.brand-logo{
  width:38px;height:38px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#4dabf7,#1971c2 60%,#0b3d91);
  position:relative;box-shadow:0 0 15px rgba(77,171,247,.6);
}
.brand-logo::after{
  content:'';position:absolute;inset:-6px;border-radius:50%;
  border:1.5px dashed rgba(246,196,83,.7);
  animation:orbit 6s linear infinite;
}
@keyframes orbit{to{transform:rotate(360deg);}}
.brand-name{font-size:1.05rem;font-weight:700;letter-spacing:.5px;color:var(--pure-white);}
.brand-name span{color:var(--warm-gold);}
.nav-links{display:flex;gap:.3rem;flex-wrap:wrap;}
.nav-links button{
  background:transparent;border:none;color:#cdd4ff;
  padding:.5rem .85rem;border-radius:10px;
  font-size:.92rem;cursor:pointer;transition:var(--transition);
  font-family:inherit;
}
.nav-links button:hover,.nav-links button.active{
  background:var(--deep-blue);color:var(--warm-gold);
}
.hamburger{display:none;background:none;border:none;color:#fff;font-size:1.6rem;cursor:pointer;}
/* ============ PAGES ============ */
.page{display:none;max-width:1150px;margin:0 auto;padding:2rem 1.2rem 4rem;animation:fadeUp .5s ease;}
.page.active{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:none;}}
h1,h2,h3{line-height:1.3;letter-spacing:.3px;}
h1{font-size:2.2rem;margin-bottom:.6rem;}
h2{font-size:1.6rem;margin-bottom:1rem;color:var(--warm-gold);}
h3{font-size:1.2rem;margin-bottom:.6rem;color:var(--soft-lavender);}
p{margin-bottom:.9rem;color:#dbe1ff;}
a{color:var(--warm-gold);}
/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;gap:.5rem;
  padding:.7rem 1.4rem;border-radius:12px;border:none;
  font-size:.95rem;font-weight:600;cursor:pointer;
  transition:var(--transition);text-decoration:none;font-family:inherit;
}
.btn-primary{background:linear-gradient(135deg,#f6c453,#e0a82e);color:#1a1a2e;}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(246,196,83,.4);}
.btn-secondary{background:var(--deep-blue);color:var(--pure-white);border:1px solid var(--border);}
.btn-secondary:hover{background:#1c2550;transform:translateY(-2px);}
.btn-ghost{background:transparent;color:var(--soft-lavender);border:1px solid var(--soft-lavender);}
.btn-ghost:hover{background:rgba(162,155,254,.15);}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none !important;}
.btn-row{display:flex;gap:.8rem;flex-wrap:wrap;margin-top:1.2rem;}
/* ============ HERO ============ */
.hero{
  text-align:center;padding:3rem 1rem;
  position:relative;overflow:hidden;
  border-radius:24px;margin-bottom:2rem;
  background:radial-gradient(ellipse at 50% 0%,rgba(77,171,247,.15),transparent 70%);
}
.hero h1{font-size:2.6rem;background:linear-gradient(135deg,#fff,#f6c453,#a29bfe);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.hero .subtitle{font-size:1.15rem;color:var(--soft-lavender);margin-bottom:1rem;font-weight:500;}
.hero p{max-width:680px;margin:0 auto 1.5rem;color:#c9d1ff;}
.solar-illustration{
  width:220px;height:220px;margin:1.5rem auto;position:relative;
}
.sun-hero{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:60px;height:60px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff4c2,#f6c453 45%,#e08e00);
  box-shadow:0 0 40px rgba(246,196,83,.8);
}
.orbit-hero{
  position:absolute;top:50%;left:50%;width:180px;height:180px;
  margin:-90px 0 0 -90px;border:1.5px dashed rgba(162,155,254,.4);
  border-radius:50%;animation:spin 12s linear infinite;
}
.earth-hero{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:28px;height:28px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#4dabf7,#1971c2 70%);
  box-shadow:0 0 12px rgba(77,171,247,.7);
}
@keyframes spin{to{transform:rotate(360deg);}}
.info-badges{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;margin-top:1rem;}
.badge{
  background:rgba(162,155,254,.15);border:1px solid var(--border);
  padding:.35rem .9rem;border-radius:20px;font-size:.82rem;color:var(--soft-lavender);
}
/* ============ CARDS ============ */
.grid{display:grid;gap:1.2rem;}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));}
.card{
  background:var(--card-bg);border:1px solid var(--border);
  border-radius:var(--radius);padding:1.4rem;
  box-shadow:var(--shadow);transition:var(--transition);
  backdrop-filter:blur(8px);
}
.card:hover{transform:translateY(-4px);border-color:var(--soft-lavender);}
.card-icon{font-size:1.8rem;margin-bottom:.6rem;}
.card h3{color:var(--warm-gold);}
.card p{font-size:.92rem;color:#c9d1ff;}
/* ============ BREADCRUMB ============ */
.breadcrumb{font-size:.83rem;color:#8a91b8;margin-bottom:1.2rem;}
.breadcrumb span{color:var(--warm-gold);}
/* ============ MATERIAL SECTION ============ */
.toc{
  background:rgba(162,155,254,.08);border:1px solid var(--border);
  border-radius:var(--radius);padding:1rem 1.3rem;margin-bottom:1.5rem;
}
.toc h4{color:var(--warm-gold);margin-bottom:.5rem;font-size:1rem;}
.toc ul{list-style:none;display:flex;flex-wrap:wrap;gap:.5rem;}
.toc li button{
  background:var(--deep-blue);border:1px solid var(--border);
  color:#dbe1ff;padding:.4rem .9rem;border-radius:8px;font-size:.85rem;cursor:pointer;transition:var(--transition);font-family:inherit;
}
.toc li button:hover{background:var(--soft-lavender);color:#0a0e27;}
.material-block{
  background:var(--card-bg);border:1px solid var(--border);
  border-radius:var(--radius);padding:1.4rem;margin-bottom:1.2rem;
}
.term{
  color:var(--warm-gold);font-weight:700;cursor:help;
  border-bottom:1.5px dotted var(--warm-gold);
}
.fact-box{
  background:rgba(246,196,83,.1);border-left:4px solid var(--warm-gold);
  padding:.9rem 1.1rem;border-radius:0 10px 10px 0;margin:1rem 0;
}
.fact-box strong{color:var(--warm-gold);}
table{width:100%;border-collapse:collapse;margin:1rem 0;font-size:.9rem;}
th,td{padding:.7rem;border:1px solid var(--border);text-align:left;}
th{background:var(--deep-blue);color:var(--warm-gold);}
details{background:rgba(162,155,254,.06);border:1px solid var(--border);border-radius:10px;padding:.7rem 1rem;margin:.6rem 0;}
summary{cursor:pointer;font-weight:600;color:var(--soft-lavender);}
details p{margin-top:.6rem;font-size:.9rem;}
.progress-bar{
  height:8px;background:var(--deep-blue);border-radius:10px;overflow:hidden;margin:.5rem 0 1.5rem;
}
.progress-fill{height:100%;background:linear-gradient(90deg,#a29bfe,#f6c453);transition:width .5s;}
/* ============ SIMULATION ============ */
.sim-container{
  background:radial-gradient(ellipse at center,#0d1235,#05061a);
  border-radius:var(--radius);border:1px solid var(--border);
  position:relative;overflow:hidden;margin-bottom:1rem;
  height:420px;
}
.sim-container canvas{width:100%;height:100%;display:block;touch-action:none;}
.sim-controls{
  display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;
  background:var(--card-bg);border:1px solid var(--border);
  border-radius:var(--radius);padding:1rem;
}
.sim-controls label{font-size:.85rem;color:var(--soft-lavender);}
.sim-controls input[type=range]{width:120px;accent-color:var(--warm-gold);}
.sim-controls .btn{padding:.45rem .9rem;font-size:.85rem;}
.sim-controls .btn.active{background:var(--warm-gold);color:#0a0e27;}
/* ============ WORDWALL ============ */
.wall-card{
  background:var(--card-bg);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;transition:var(--transition);
}
.wall-card:hover{transform:translateY(-5px);border-color:var(--warm-gold);}
.wall-thumb{
  height:150px;display:flex;align-items:center;justify-content:center;
  font-size:3rem;position:relative;overflow:hidden;
}
.wall-thumb.w1{background:linear-gradient(135deg,#667eea,#764ba2);}
.wall-thumb.w2{background:linear-gradient(135deg,#f093fb,#f5576c);}
.wall-thumb.w3{background:linear-gradient(135deg,#4facfe,#00f2fe);}
.wall-thumb .label{
  position:absolute;top:10px;left:10px;background:rgba(0,0,0,.5);
  padding:.25rem .7rem;border-radius:20px;font-size:.75rem;color:#fff;
}
.wall-body{padding:1.1rem;}
.wall-body h3{color:var(--pure-white);}
.wall-body p{font-size:.87rem;margin-bottom:1rem;}
/* ============ QUIZ ============ */
.quiz-progress{
  display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.2rem;
}
.quiz-dot{
  width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--deep-blue);border:1px solid var(--border);
  font-size:.85rem;color:#8a91b8;transition:var(--transition);
}
.quiz-dot.active{border-color:var(--warm-gold);color:var(--warm-gold);transform:scale(1.1);}
.quiz-dot.answered{background:var(--soft-lavender);color:#0a0e27;border-color:var(--soft-lavender);}
.quiz-question{
  background:var(--card-bg);border:1px solid var(--border);
  border-radius:var(--radius);padding:1.5rem;margin-bottom:1rem;
}
.quiz-question h3{color:var(--pure-white);font-size:1.1rem;margin-bottom:1.2rem;}
.option{
  display:flex;align-items:center;gap:.8rem;
  background:var(--deep-blue);border:1.5px solid var(--border);
  border-radius:12px;padding:.9rem 1.1rem;margin-bottom:.7rem;
  cursor:pointer;transition:var(--transition);
}
.option:hover{border-color:var(--soft-lavender);background:#1c2550;}
.option.selected{border-color:var(--warm-gold);background:rgba(246,196,83,.12);}
.option .letter{
  width:30px;height:30px;border-radius:50%;background:var(--midnight-navy);
  display:flex;align-items:center;justify-content:center;font-weight:700;
  color:var(--soft-lavender);flex-shrink:0;
}
.option.selected .letter{background:var(--warm-gold);color:#0a0e27;}
/* ============ FORM ============ */
.form-group{margin-bottom:1.1rem;}
.form-group label{display:block;margin-bottom:.4rem;font-size:.92rem;color:var(--soft-lavender);font-weight:600;}
.form-group input{
  width:100%;padding:.85rem 1rem;border-radius:10px;
  background:var(--deep-blue);border:1.5px solid var(--border);
  color:#fff;font-size:.95rem;font-family:inherit;
  transition:var(--transition);
}
.form-group input:focus{outline:none;border-color:var(--warm-gold);}
.form-group input.error{border-color:#ff6b6b;}
.error-msg{color:#ff6b6b;font-size:.8rem;margin-top:.3rem;display:none;}
.error-msg.show{display:block;}
/* ============ RESULT ============ */
.result-card{
  background:var(--card-bg);border:1px solid var(--border);
  border-radius:var(--radius);padding:2rem;text-align:center;
  box-shadow:var(--shadow);
}
.score-circle{
  width:160px;height:160px;border-radius:50%;margin:1rem auto;
  display:flex;align-items:center;justify-content:center;
  background:conic-gradient(var(--warm-gold) 0%,var(--deep-blue) 0%);
  position:relative;
}
.score-circle::before{
  content:'';position:absolute;inset:12px;border-radius:50%;
  background:var(--card-bg);
}
.score-value{position:relative;font-size:2.6rem;font-weight:800;color:var(--warm-gold);}
.stat-row{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin:1.2rem 0;}
.stat{
  background:var(--deep-blue);border:1px solid var(--border);
  border-radius:12px;padding:.8rem 1.3rem;min-width:100px;
}
.stat .num{font-size:1.5rem;font-weight:700;color:var(--warm-gold);}
.stat .lbl{font-size:.8rem;color:#9aa2cc;}
.review-item{
  background:var(--deep-blue);border:1px solid var(--border);
  border-radius:12px;padding:1rem;margin-bottom:.8rem;text-align:left;
}
.review-item.correct{border-left:4px solid #4ade80;}
.review-item.wrong{border-left:4px solid #ff6b6b;}
.review-item .q{font-weight:600;margin-bottom:.4rem;font-size:.92rem;}
.review-item .a{font-size:.86rem;color:#c9d1ff;}
.review-item .exp{font-size:.83rem;color:#9aa2cc;margin-top:.4rem;font-style:italic;}
/* ============ BADGES / MISSIONS ============ */
.mission-card{
  background:var(--card-bg);border:1px solid var(--border);
  border-radius:var(--radius);padding:1.2rem;position:relative;
  transition:var(--transition);
}
.mission-card.done{border-color:#4ade80;background:rgba(74,222,128,.08);}
.mission-card .check{
  position:absolute;top:12px;right:12px;width:26px;height:26px;
  border-radius:50%;background:#4ade80;color:#0a0e27;
  display:none;align-items:center;justify-content:center;font-weight:700;
}
.mission-card.done .check{display:flex;}
.badge-display{
  display:flex;gap:1rem;flex-wrap:wrap;margin:1.5rem 0;
}
.digital-badge{
  width:100px;height:100px;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--deep-blue);border:2px dashed var(--border);
  font-size:.72rem;text-align:center;padding:.5rem;color:#8a91b8;
  transition:var(--transition);
}
.digital-badge.earned{
  background:linear-gradient(135deg,#f6c453,#e0a82e);
  color:#0a0e27;border:2px solid #fff;box-shadow:0 0 20px rgba(246,196,83,.6);
  font-weight:700;
}
.digital-badge .icon{font-size:1.6rem;margin-bottom:.2rem;}
/* ============ GLOSSARY ============ */
.glossary-search{
  width:100%;padding:.9rem 1.1rem;border-radius:12px;
  background:var(--deep-blue);border:1.5px solid var(--border);
  color:#fff;font-size:1rem;margin-bottom:1.2rem;font-family:inherit;
}
.glossary-search:focus{outline:none;border-color:var(--warm-gold);}
.gloss-item{
  background:var(--card-bg);border:1px solid var(--border);
  border-radius:12px;padding:1rem 1.2rem;margin-bottom:.7rem;cursor:pointer;
  transition:var(--transition);
}
.gloss-item:hover{border-color:var(--soft-lavender);}
.gloss-item .term-name{font-weight:700;color:var(--warm-gold);}
.gloss-item .def{font-size:.88rem;margin-top:.4rem;display:none;color:#dbe1ff;}
.gloss-item.open .def{display:block;}
/* ============ VIDEO ============ */
.video-frame{
  width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;
  background:#000;position:relative;
}
.video-frame iframe{width:100%;height:100%;border:0;}
.video-placeholder{
  width:100%;aspect-ratio:16/9;border-radius:12px;
  background:linear-gradient(135deg,#0d1235,#1c2550);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:.6rem;color:#8a91b8;text-align:center;padding:1rem;
}
.video-placeholder .play{
  width:60px;height:60px;border-radius:50%;
  background:var(--warm-gold);display:flex;align-items:center;justify-content:center;
  color:#0a0e27;font-size:1.5rem;cursor:pointer;transition:var(--transition);
}
.video-placeholder .play:hover{transform:scale(1.1);}
/* ============ CLOSING ============ */
.closing{
  text-align:center;padding:4rem 1rem;
  background:radial-gradient(ellipse at center,rgba(246,196,83,.12),transparent 70%);
  border-radius:24px;
}
.closing .earth-big{
  width:100px;height:100px;border-radius:50%;margin:0 auto 1.5rem;
  background:radial-gradient(circle at 30% 30%,#4dabf7,#1971c2 70%);
  box-shadow:0 0 40px rgba(77,171,247,.7);
  position:relative;
}
.closing .earth-big::after{
  content:'';position:absolute;inset:-20px;border-radius:50%;
  border:2px dashed rgba(246,196,83,.5);
  animation:orbit 15s linear infinite;
}
/* ============ FOOTER NAV ============ */
.page-nav{
  display:flex;justify-content:space-between;gap:1rem;
  margin-top:2.5rem;padding-top:1.5rem;border-top:1px solid var(--border);
  flex-wrap:wrap;
}
/* ============ RESPONSIVE ============ */
@media(max-width:768px){
  .nav-links{
    display:none;width:100%;flex-direction:column;
    background:var(--deep-blue);border-radius:12px;
    padding:.8rem;margin-top:.5rem;
  }
  .nav-links.open{display:flex;}
  .hamburger{display:block;}
  .hero h1{font-size:1.9rem;}
  h1{font-size:1.6rem;}
  h2{font-size:1.3rem;}
  .page{padding:1.2rem .8rem 3rem;}
  .sim-container{height:320px;}
  .quiz-dot{width:28px;height:28px;font-size:.75rem;}
}
/* ============ UTILITIES ============ */
.hidden{display:none !important;}
.text-center{text-align:center;}
.mt-1{margin-top:.5rem;}.mt-2{margin-top:1rem;}.mt-3{margin-top:1.5rem;}
.mb-1{margin-bottom:.5rem;}.mb-2{margin-bottom:1rem;}.mb-3{margin-bottom:1.5rem;}
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);
  background:var(--warm-gold);color:#0a0e27;padding:.8rem 1.5rem;
  border-radius:12px;font-weight:600;z-index:2000;transition:.4s;
  box-shadow:0 8px 30px rgba(0,0,0,.5);font-size:.9rem;
}
.toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div id="starfield"></div>
<div class="toast" id="toast">✓</div>

<!-- ============ NAVBAR ============ -->
<nav class="navbar">
  <div class="brand" onclick="showPage('beranda')">
    <div class="brand-logo"></div>
    <div class="brand-name">Petualangan <span>Tata Surya</span></div>
  </div>
  <button class="hamburger" onclick="document.querySelector('.nav-links').classList.toggle('open')">☰</button>
  <div class="nav-links" id="navLinks">
    <button onclick="showPage('beranda')" data-nav="beranda" class="active">Beranda</button>
    <button onclick="showPage('materi')" data-nav="materi">Materi</button>
    <button onclick="showPage('video')" data-nav="video">Video</button>
    <button onclick="showPage('simulasi')" data-nav="simulasi">Simulasi</button>
    <button onclick="showPage('game')" data-nav="game">Game</button>
    <button onclick="showPage('latihan')" data-nav="latihan">Latihan</button>
    <button onclick="showPage('kuis')" data-nav="kuis">Kuis</button>
    <button onclick="showPage('hasil')" data-nav="hasil">Hasil</button>
    <button onclick="showPage('sumber')" data-nav="sumber">Sumber</button>
  </div>
</nav>

<!-- ============ BERANDA ============ -->
<section class="page active" id="page-beranda">
  <div class="hero">
    <div class="solar-illustration">
      <div class="sun-hero"></div>
      <div class="orbit-hero"><div class="earth-hero"></div></div>
    </div>
    <h1>PETUALANGAN TATA SURYA</h1>
    <div class="subtitle">Jelajahi Gerakan Bumi, Temukan Rahasia Alam Semesta</div>
    <p>Selamat datang, Penjelajah Sains! Pelajari bagaimana Bumi berputar pada porosnya (rotasi) dan mengelilingi Matahari (revolusi) melalui materi, simulasi interaktif, video, dan permainan edukatif.</p>
    <div class="btn-row" style="justify-content:center;">
      <button class="btn btn-primary" onclick="showPage('materi')">🚀 Mulai Belajar</button>
      <button class="btn btn-secondary" onclick="showPage('simulasi')">🌍 Jelajahi Simulasi</butt
